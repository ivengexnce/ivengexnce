name: Generate GitHub Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  generate-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Generate GitHub contribution snake
        uses: Platane/snk@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          github_user_name: ivengexnce
          outputs: |
            dist/github-contribution-grid-snake.svg?speed_factor=5
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&speed_factor=5

      - name: Fix permissions
        run: chmod -R u+w dist/

      - name: Inject date label into SVGs
        run: |
          python3 - <<'PYEOF'
          import os, glob, re
          from datetime import datetime, timezone

          now   = datetime.now(timezone.utc)
          label = now.strftime("%B %d, %Y")   # e.g. "April 29, 2026"

          for path in glob.glob("dist/*.svg"):
              txt = open(path, encoding="utf-8").read()

              # Read the viewBox to position the label at bottom-right
              vb = re.search(r'viewBox="0 0 ([\d.]+) ([\d.]+)"', txt)
              if vb:
                  w, h = float(vb.group(1)), float(vb.group(2))
              else:
                  w, h = 800, 128   # snk default fallback

              dark = "dark" in os.path.basename(path)
              text_color  = "#8b949e" if dark else "#57606a"
              font_family = "JetBrains Mono, Fira Code, monospace"

              date_svg = (
                  f'<text x="{w - 8}" y="{h - 6}" '
                  f'font-family="{font_family}" font-size="10" '
                  f'fill="{text_color}" text-anchor="end" '
                  f'font-weight="500" opacity="0.75">'
                  f'{label}</text>'
              )

              # Insert just before closing </svg>
              txt = txt.replace("</svg>", date_svg + "\n</svg>")
              open(path, "w", encoding="utf-8").write(txt)
              print(f"  ✅ {os.path.basename(path)} — date injected: {label}")
          PYEOF

      - name: Push to output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/snake-out
          cp dist/github-contribution-grid-snake.svg      /tmp/snake-out/
          cp dist/github-contribution-grid-snake-dark.svg /tmp/snake-out/
          git fetch origin output 2>/dev/null \
            && git checkout output \
            || git checkout --orphan output
          git rm -rf . --quiet 2>/dev/null || true
          cp /tmp/snake-out/github-contribution-grid-snake.svg      .
          cp /tmp/snake-out/github-contribution-grid-snake-dark.svg .
          git add github-contribution-grid-snake.svg \
                  github-contribution-grid-snake-dark.svg
          git diff --cached --quiet \
            && echo "No changes to commit" \
            || git commit -m "chore: update contribution snake"
          git push origin output --force

      - name: Create workflow summary
        run: |
          DATE=$(date -u '+%B %d, %Y')
          echo "✅ Snake generated — $DATE" >> $GITHUB_STEP_SUMMARY
          echo "  - Light: github-contribution-grid-snake.svg" >> $GITHUB_STEP_SUMMARY
          echo "  - Dark:  github-contribution-grid-snake-dark.svg" >> $GITHUB_STEP_SUMMARY
          echo "  - Speed: 5× | Date label: $DATE" >> $GITHUB_STEP_SUMMARY
          echo "  - Branch: output" >> $GITHUB_STEP_SUMMARY
