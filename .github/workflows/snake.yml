name: 🐍 GitHub Contribution Snake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Force regenerate even if no new contributions"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
  push:
    branches: [main]

concurrency:
  group: snake-generation
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-snake:
    name: 🐍 Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 📦 Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: snake-pip-${{ runner.os }}

      - name: 🐍 Generate Snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ivengexnce
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ── THE FIX: snk@v3 writes files as read-only (444). chmod before touching them.
      - name: 🔓 Fix SVG file permissions
        run: |
          chmod -R u+w dist/
          echo "✅ Permissions fixed:"
          ls -lah dist/

      - name: ⚡ Patch SVGs — 2× Speed + Glow Effects
        run: |
          python3 - <<'PYEOF'
          import re, os, glob

          SVG_DIR = "dist"
          SPEED   = 2.0

          GLOW_FILTER = """
            <defs>
              <filter id="snake-glow" x="-50%" y="-50%" width="200%" height="200%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
              <filter id="head-glow" x="-100%" y="-100%" width="300%" height="300%">
                <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
                <feMerge>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="blur"/>
                  <feMergeNode in="SourceGraphic"/>
                </feMerge>
              </filter>
            </defs>
          """

          def patch_svg(path):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              # 1. Speed up animation-duration (CSS)
              def halve_duration(m):
                  return f"animation-duration:{round(float(m.group(1)) / SPEED, 3)}s"
              content = re.sub(r"animation-duration:([\d.]+)s", halve_duration, content)

              # 2. Speed up dur= (SMIL)
              def halve_dur(m):
                  return f'dur="{round(float(m.group(1)) / SPEED, 3)}s"'
              content = re.sub(r'dur="([\d.]+)s"', halve_dur, content)

              # 3. Smoother easing
              content = content.replace(
                  "animation-timing-function:linear",
                  "animation-timing-function:cubic-bezier(0.4,0,0.2,1)"
              )

              # 4. Inject glow defs
              if "snake-glow" not in content:
                  content = re.sub(r"(<svg[^>]*>)", r"\1" + GLOW_FILTER, content, count=1)

              # 5. Apply glow to snake paths
              content = re.sub(
                  r'(<(?:path|polyline)[^>]*class="[^"]*snake[^"]*"[^>]*)',
                  r'\1 filter="url(#snake-glow)"',
                  content
              )

              # 6. Rendering quality hints
              if "shape-rendering" not in content:
                  content = content.replace(
                      "<svg ",
                      '<svg shape-rendering="geometricPrecision" text-rendering="optimizeLegibility" ',
                      1
                  )

              # 7. GPU compositing hint (only first occurrence)
              content = content.replace(
                  "animation-duration:",
                  "will-change:transform;animation-duration:",
                  1
              )

              with open(path, "w", encoding="utf-8") as f:
                  f.write(content)

              print(f"  ✅ Patched: {os.path.basename(path)} ({os.path.getsize(path):,} bytes)")

          svgs = glob.glob(os.path.join(SVG_DIR, "*.svg"))
          if not svgs:
              print("⚠️  No SVGs found — skipping patch.")
          else:
              for svg in svgs:
                  patch_svg(svg)
              print(f"\n✅ {len(svgs)} SVG(s) patched — 2× speed + glow applied.")
          PYEOF

      - name: 🔍 Verify output
        run: |
          for f in \
            dist/github-contribution-grid-snake.svg \
            dist/github-contribution-grid-snake-dark.svg; do
            if [ -f "$f" ]; then
              echo "  ✅ $f — $(wc -c < "$f") bytes"
            else
              echo "  ❌ MISSING: $f" && exit 1
            fi
          done

      - name: 🚀 Push snake to output branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          publish_branch: output
          keep_files: false
          force_orphan: false
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
          commit_message: "🐍 chore: update contribution snake"

      - name: 📋 Write job summary
        if: always()
        run: |
          {
            echo "## 🐍 GitHub Contribution Snake"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| 🕐 Generated at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo "| ⚡ Speed | 2× double speed |"
            echo "| 🌞 Light SVG | \`github-contribution-grid-snake.svg\` |"
            echo "| 🌙 Dark SVG  | \`github-contribution-grid-snake-dark.svg\` |"
            echo "| 📦 Branch | \`output\` |"
          } >> "$GITHUB_STEP_SUMMARY"
