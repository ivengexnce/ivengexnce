name: 🐍 GitHub Contribution Snake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: "Force regenerate even if no new contributions"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
  push:
    branches: [main]

concurrency:
  group: snake-generation
  cancel-in-progress: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-snake:
    name: 🐍 Generate Contribution Snake
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── 2. Cache pip ───────────────────────────────────────────────────────
      - name: 📦 Cache pip
        uses: actions/cache@v4.2.3
        with:
          path: ~/.cache/pip
          key: snake-pip-${{ runner.os }}-v1

      # ── 3. Generate Snake SVGs ─────────────────────────────────────────────
      # FIX: pass github_token explicitly — snk needs it to read contribution data
      # Without this the action hits the unauthenticated API and gets 401 Unauthorized
      - name: 🐍 Generate Snake SVGs (Platane/snk)
        id: snk
        continue-on-error: true
        uses: Platane/snk@v3.0.0
        with:
          github_user_name: ivengexnce
          github_token: ${{ secrets.GITHUB_TOKEN }}    # ← THE FIX for "Unauthorized"
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ── 4. Fallback: generate via GitHub GraphQL API if snk still fails ────
      - name: 🔄 Fallback Snake Generator
        if: steps.snk.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install requests --quiet
          python3 - <<'PYEOF'
          import os, requests

          TOKEN    = os.environ["GH_TOKEN"]
          USERNAME = "ivengexnce"
          HEADERS  = {"Authorization": f"Bearer {TOKEN}",
                      "Accept": "application/vnd.github+json"}

          query = """
          query($login: String!) {
            user(login: $login) {
              contributionsCollection {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """
          resp = requests.post(
              "https://api.github.com/graphql",
              headers=HEADERS,
              json={"query": query, "variables": {"login": USERNAME}}
          )
          resp.raise_for_status()
          weeks = resp.json()["data"]["user"]["contributionsCollection"]["contributionCalendar"]["weeks"]

          CELL, GAP = 11, 2
          STEP = CELL + GAP
          W = len(weeks) * STEP + 20
          H = 7 * STEP + 20

          def make_svg(dark=False):
              bg    = "#0d1117" if dark else "#ffffff"
              empty = "#161b22" if dark else "#ebedf0"
              cols  = ["#003820","#006d32","#26a641","#39d353"] if dark else \
                      ["#9be9a8","#40c463","#30a14e","#216e39"]
              rects = []
              for wi, week in enumerate(weeks):
                  for di, day in enumerate(week["contributionDays"]):
                      c = day["contributionCount"]
                      fill = empty if c == 0 else cols[min(int((c-1)/3), 3)]
                      rects.append(
                          f'<rect x="{wi*STEP+10}" y="{di*STEP+10}" '
                          f'width="{CELL}" height="{CELL}" rx="2" fill="{fill}">'
                          f'<title>{day["date"]}: {c} contributions</title></rect>'
                      )
              return (f'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 {W} {H}" '
                      f'style="background:{bg}">\n' + "\n".join(rects) + "\n</svg>")

          os.makedirs("dist", exist_ok=True)
          with open("dist/github-contribution-grid-snake.svg",      "w") as f: f.write(make_svg(False))
          with open("dist/github-contribution-grid-snake-dark.svg", "w") as f: f.write(make_svg(True))
          print("✅ Fallback SVGs generated.")
          PYEOF

      # ── 5. Fix permissions (snk writes read-only files) ────────────────────
      - name: 🔓 Fix SVG permissions
        run: chmod -R u+w dist/ && ls -lah dist/

      # ── 6. Patch — 2× speed + glow ────────────────────────────────────────
      - name: ⚡ Patch SVGs — 2× Speed + Glow
        run: |
          python3 - <<'PYEOF'
          import re, os, glob

          SVG_DIR = "dist"
          SPEED   = 2.0

          GLOW = """<defs>
            <filter id="snake-glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
              <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>"""

          def patch(path):
              txt = open(path, encoding="utf-8").read()
              txt = re.sub(r"animation-duration:([\d.]+)s",
                           lambda m: f"animation-duration:{round(float(m.group(1))/SPEED,3)}s", txt)
              txt = re.sub(r'dur="([\d.]+)s"',
                           lambda m: f'dur="{round(float(m.group(1))/SPEED,3)}s"', txt)
              txt = txt.replace("animation-timing-function:linear",
                                "animation-timing-function:cubic-bezier(0.4,0,0.2,1)")
              if "snake-glow" not in txt:
                  txt = re.sub(r"(<svg[^>]*>)", r"\1" + GLOW, txt, count=1)
              txt = re.sub(r'(<(?:path|polyline)[^>]*class="[^"]*snake[^"]*"[^>]*)',
                           r'\1 filter="url(#snake-glow)"', txt)
              if "shape-rendering" not in txt:
                  txt = txt.replace("<svg ", '<svg shape-rendering="geometricPrecision" ', 1)
              txt = txt.replace("animation-duration:", "will-change:transform;animation-duration:", 1)
              open(path, "w", encoding="utf-8").write(txt)
              print(f"  ✅ {os.path.basename(path)} ({os.path.getsize(path):,} bytes)")

          svgs = glob.glob(os.path.join(SVG_DIR, "*.svg"))
          [patch(s) for s in svgs]
          print(f"✅ {len(svgs)} SVG(s) patched.")
          PYEOF

      # ── 7. Verify ─────────────────────────────────────────────────────────
      - name: 🔍 Verify output
        run: |
          for f in dist/github-contribution-grid-snake.svg \
                   dist/github-contribution-grid-snake-dark.svg; do
            [ -f "$f" ] && [ -s "$f" ] \
              && echo "  ✅ $f — $(wc -c < "$f") bytes" \
              || { echo "  ❌ MISSING: $f"; exit 1; }
          done

      # ── 8. Push to output branch ───────────────────────────────────────────
      # Using git directly instead of peaceiris/actions-gh-pages to avoid
      # the Node 20 warning from that action (it hasn't shipped a Node 24 build yet)
      - name: 🚀 Push to output branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Fetch or create the output branch
          git fetch origin output:output 2>/dev/null || git checkout --orphan output

          # Switch to output branch and replace contents
          git checkout output 2>/dev/null || true
          git checkout output -- . 2>/dev/null || true

          # Remove everything, copy fresh SVGs
          git rm -rf . --quiet 2>/dev/null || true
          cp -r $GITHUB_WORKSPACE/dist/. .

          git add github-contribution-grid-snake.svg \
                  github-contribution-grid-snake-dark.svg

          git diff --cached --quiet \
            && echo "⏭️  No changes — output branch already up to date." \
            || git commit -m "🐍 chore: update contribution snake [$(date -u '+%Y-%m-%d %H:%M UTC')]"

          git push origin output --force-with-lease 2>/dev/null \
            || git push origin output --force

      # ── 9. Job summary ─────────────────────────────────────────────────────
      - name: 📋 Job summary
        if: always()
        run: |
          SRC="Platane/snk"
          [ "${{ steps.snk.outcome }}" = "failure" ] && SRC="Fallback (GitHub GraphQL)"
          {
            echo "## 🐍 GitHub Contribution Snake"
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| 🕐 Generated at | $(date -u '+%Y-%m-%d %H:%M:%S UTC') |"
            echo "| ⚡ Speed | 2× double speed |"
            echo "| 🔧 Source | $SRC |"
            echo "| 🌞 Light SVG | \`github-contribution-grid-snake.svg\` |"
            echo "| 🌙 Dark SVG  | \`github-contribution-grid-snake-dark.svg\` |"
            echo "| 📦 Branch | \`output\` |"
          } >> "$GITHUB_STEP_SUMMARY"
